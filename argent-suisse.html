<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥈 Argent Suisse</title>

  <link rel="stylesheet" href="style.css?v=20263004">
  <link rel="stylesheet" href="couleurs.css?v=20263004">
  
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left"><h2>🥈 Argent Suisse</h2><small>Stock sécurisé</small></div>
  <div class="header-right"><a href="index.html" class="badge">← Retour</a></div>
</div>

<div class="container"> <!-- TOTAL -->
<div class="highlight"><small>Total Argent Suisse</small><h2 id="totalSilver">0 g</h2></div>
<div class="card"><h3>Argent</h3>

	
  <!-- TABLE -->
  

    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Qté</th>
          <th>Poids</th>
        </tr>
      </thead>

      <tbody>

        <!-- LINGOTS -->
        <tr>
          <td colspan="3"><strong>🧱 Lingots</strong></td>
        </tr>

        <tr data-label="L. 1Kg."><td>Lingot Argent 1 kg</td><td>0</td><td class="poids">0 g</td></tr>
		</tbody>  
</table>       

<br>

   
	<div class="total-line">
	   <span><span class="dot dot-argent"></span> Total des achats en Suisse : </span>
	   <span id="totalValeur">0 €</span>
	</div>
	<div class="total-sub">
		<span id="tableTotal">0 g</span>
	    <span id="prixMoyen">0 €/g</span>
	</div>

</div><!-- Fin CARD -->
</div><!-- Fin container -->  

<script src="achats.js"></script>	


<script>

// 🔹 données
const data = typeof metaux !== "undefined" ? metaux : [];

// 🔹 filtre ARGENT Suisse
const argentSuisse = data.filter(m => m.type === "ARGENT" && m.loc === "Suisse");

// 🔹 mapping
const map = {};

argentSuisse.forEach(m => {
  if (!map[m.label]) {
    map[m.label] = { poids: 0, total: 0 };
  }

  map[m.label].poids += m.poids || 0;
  map[m.label].total += m.tot || 0;
});

// 🔹 totaux
let totalPoids = 0;
let totalValeur = 0;

argentSuisse.forEach(m => {
  totalPoids += m.poids || 0;
  totalValeur += m.tot || 0;
});

// 🔹 injection lignes
document.querySelectorAll("tr[data-label]").forEach(row => {
  const label = row.dataset.label;
  const item = map[label];

  if (!item) return;

  const poidsCell = row.querySelector(".poids");
  if (poidsCell) {
    poidsCell.textContent = item.poids.toFixed(2) + " g";
  }
});

// 🔹 prix moyen
const prixMoyen = totalPoids > 0 ? totalValeur / totalPoids : 0;

// 🔹 affichage
document.getElementById("totalSilver").textContent =
  totalPoids.toFixed(2) + " g";

document.getElementById("tableTotal").textContent =
  totalPoids.toFixed(2) + " g";

document.getElementById("totalValeur").textContent =
  totalValeur.toFixed(2) + " €";

document.getElementById("prixMoyen").textContent =
  prixMoyen.toFixed(3) + " €/g";

</script>

</body>
</html>
